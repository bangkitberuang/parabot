<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="galurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A5C" />
      <stop offset="50%" stop-color="#086B85" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadowGalur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#galurGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.4" filter="url(#shadowGalur)" />
  <rect x="14" y="14" width="228" height="228" rx="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Flowchart & Nodes Icon -->
  <g transform="translate(48, 40)">
    <!-- Node Top -->
    <rect x="52" y="4" width="56" height="32" rx="8" fill="url(#cyanAccent)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="80" cy="20" r="4" fill="#0E4A5C"/>

    <!-- Connecting line down -->
    <path d="M80 36 L80 60" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Decision Diamond (Center) -->
    <polygon points="80,56 112,78 80,100 48,78" fill="#FFFFFF" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="80" cy="78" r="4.5" fill="#38BDF8"/>

    <!-- Branch Left -->
    <path d="M48 78 L24 78 L24 104" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="4" y="104" width="40" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#BAE6FD" stroke-width="2"/>

    <!-- Branch Right -->
    <path d="M112 78 L136 78 L136 104" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="104" width="40" height="26" rx="6" fill="url(#cyanAccent)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="128" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GALUR</text>
  <text x="128" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" text-anchor="middle" letter-spacing="1">FLOW &amp; MIND MAPPING</text>
</svg>
