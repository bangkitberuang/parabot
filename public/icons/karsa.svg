<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="karsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043D2E" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0B7A5C" />
    </linearGradient>
    <linearGradient id="karsaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#karsaGrad)" stroke="#10B981" stroke-width="4" stroke-opacity="0.4" filter="url(#shadow)" />
  
  <!-- Subtle Internal Highlight -->
  <rect x="14" y="14" width="228" height="228" rx="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Central Kanban / Planner Icon -->
  <g transform="translate(48, 42)">
    <!-- Kanban Column 1 -->
    <rect x="0" y="8" width="46" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.1" stroke="#34D399" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="8" y="20" width="30" height="18" rx="5" fill="#34D399" fill-opacity="0.8"/>
    <rect x="8" y="46" width="30" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="8" y="80" width="30" height="14" rx="5" fill="#FFFFFF" fill-opacity="0.15"/>

    <!-- Kanban Column 2 (Main active) -->
    <rect x="56" y="0" width="48" height="112" rx="10" fill="#FFFFFF" fill-opacity="0.15" stroke="#34D399" stroke-width="2.5"/>
    <rect x="64" y="14" width="32" height="32" rx="6" fill="url(#karsaAccent)"/>
    <path d="M74 30 L78 34 L86 26" stroke="#043D2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="54" width="32" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="64" y="84" width="32" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>

    <!-- Kanban Column 3 -->
    <rect x="114" y="14" width="46" height="90" rx="10" fill="#FFFFFF" fill-opacity="0.1" stroke="#34D399" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="122" y="26" width="30" height="20" rx="5" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="122" y="54" width="30" height="38" rx="5" fill="#34D399" fill-opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="128" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">KARSA</text>
  <text x="128" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">PROJECT PLANNER</text>
</svg>
